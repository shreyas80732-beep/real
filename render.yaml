services:
  - type: web
    name: notecraft-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 10000
      - key: GEMINI_MODEL
        value: gemini-3.7-flash
      - key: SKIP_PAYMENT
        value: false
